name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Every version reports its own result. A failure on 3.10 should not hide
      # whether 3.12 passes.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The slow marker is on the end-to-end MNIST test, and only on that: it
      # downloads 15 MB from OpenML, which is a third-party service this suite
      # has no business depending on. Everything else runs here, including every
      # gradient check.
      - name: Test
        run: pytest -m "not slow" -q

      # The gradient checks are the correctness argument of this project, so it
      # is worth failing loudly rather than quietly if they stop being collected.
      # pytest exits 5 when a selection matches nothing, so a rename that
      # orphaned them would turn this step red instead of passing as a no-op.
      - name: Gradient checks ran
        run: pytest -m "not slow" -k gradcheck -q
